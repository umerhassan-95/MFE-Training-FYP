services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_PORT: 3000
      JWT_SECRET: docker-dev-secret

  products:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        WORKSPACE: "@meridian/mfe-products"
        APP_DIR: mfe-products
        PUBLIC_URL: http://localhost:4201/
        API_URL: http://localhost:3000
    ports:
      - "4201:80"

  cart:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        WORKSPACE: "@meridian/mfe-cart"
        APP_DIR: mfe-cart
        PUBLIC_URL: http://localhost:4202/
        API_URL: http://localhost:3000
    ports:
      - "4202:80"

  orders:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        WORKSPACE: "@meridian/mfe-orders"
        APP_DIR: mfe-orders
        PUBLIC_URL: http://localhost:4203/
        API_URL: http://localhost:3000
    ports:
      - "4203:80"

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        WORKSPACE: "@meridian/gateway"
        APP_DIR: gateway
        PUBLIC_URL: http://localhost:4200/
        API_URL: http://localhost:3000
        REMOTE_PRODUCTS_URL: http://localhost:4201
        REMOTE_CART_URL: http://localhost:4202
        REMOTE_ORDERS_URL: http://localhost:4203
    ports:
      - "4200:80"
    depends_on:
      - api
      - products
      - cart
      - orders
